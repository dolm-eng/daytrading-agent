name: Day trading (paper)

# DÉCLENCHEMENT
# Le planning de GitHub (schedule) peut partir avec des HEURES de retard : le
# 12 et le 13/10/2026, le job du matin est parti après la clôture. Le vrai
# déclencheur est donc externe (cron-job.org, heure de New York) qui appelle
# l'API "workflow_dispatch" pile à l'heure :
#   matin : 9h15 NY  -> inputs {"phase": "morning", "dry_run": "false"}
#   soir  : 15h30 NY -> inputs {"phase": "close",   "dry_run": "false"}
# Les crons GitHub ci-dessous restent en SECOURS (surtout pour fermer les
# positions le soir). Les doublons sont sans danger : les deux jobs d'une
# même phase ne tournent jamais en même temps (concurrency), le 2e voit que
# les ordres du matin / la clôture du soir sont déjà faits et ne refait rien,
# et le bot n'envoie aucun ordre d'entrée après 9h40 NY.
on:
  schedule:
    - cron: "20 13 * * 1-5"
    - cron: "7 19 * * 1-5"
  workflow_dispatch:
    inputs:
      phase:
        description: "morning / close / all"
        default: "morning"
      dry_run:
        description: "true = aucun ordre envoyé (test)"
        default: "true"

permissions:
  contents: write   # pour enregistrer journal/journal.csv

concurrency:
  # même groupe pour un job de la même phase, qu'il vienne de GitHub ou de cron-job.org
  group: daytrade-${{ inputs.phase || (github.event.schedule == '20 13 * * 1-5' && 'morning' || 'close') }}
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # dernière version, avec le journal écrit par un job précédent du jour

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Lancer le bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          PYTHONIOENCODING: utf-8
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PHASE="${{ inputs.phase }}"
            [ "${{ inputs.dry_run }}" = "true" ] && EXTRA="--dry-run"
          elif [ "${{ github.event.schedule }}" = "20 13 * * 1-5" ]; then
            PHASE=morning
          else
            PHASE=close
          fi
          python live_daytrade.py --phase "$PHASE" $EXTRA

      # Enregistre le journal dans le dépôt. Bonus : cette activité régulière
      # empêche GitHub de désactiver les tâches planifiées (il le fait au bout
      # de 60 jours sans activité sur un dépôt public).
      - name: Enregistrer le journal
        if: always()
        run: |
          if [ -n "$(git status --porcelain journal)" ]; then
            git config user.name "daytrading-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add journal
            git commit -m "Journal $(date -u +%F)"
            git push
          fi
